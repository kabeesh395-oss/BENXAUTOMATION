[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benxautomation"
version = "0.1.0"
description = "Modular AI-powered YouTube video automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BENX Team"}]

dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.28,<3",
    "edge-tts>=6.1.0",
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "starlette>=0.27.0",
    "yt-dlp>=2023.1.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<6",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: requires FFmpeg to be installed (deselect with '-m \"not ffmpeg\"')",
    "ffprobe: requires FFprobe to be installed (deselect with '-m \"not ffprobe\"')",
]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["benxautomation*"]
