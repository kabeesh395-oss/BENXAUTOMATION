name: Podcast & Shorts Daily Automation

'on':
  # 3 Shorts Daily: 09:30 AM IST (04:00 UTC), 02:30 PM IST (09:00 UTC), 07:30 PM IST (14:00 UTC)
  schedule:
    - cron: '0 4,9,14 * * *'

  # Manual on-demand execution with safety controls
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Authorized YouTube URL or leave empty for permitted test sample'
        required: false
        default: ''
      mode:
        description: 'Execution Mode'
        required: true
        type: choice
        options:
          - 'dry_run'
          - 'render_only'
          - 'upload_private'
        default: 'dry_run'
      clips_target:
        description: 'Number of highlight clips to generate (1 to 4)'
        required: true
        default: '1'

concurrency:
  group: podcast-shorts-pipeline
  cancel-in-progress: false  # Never drop or interleave runs; queue safely

jobs:
  podcast-to-shorts:
    name: Process Podcast to Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore Persistent State (Upload Ledger & Job Queue)
        uses: actions/cache@v4
        id: state-cache
        with:
          path: |
            output/upload_ledger.sqlite
            output/podcast_batch_jobs.db
          key: podcast-state-${{ github.run_id }}
          restore-keys: |
            podcast-state-

      - name: Run Cloud Pipeline (Podcast-to-Shorts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODCAST_SCHEDULED_SOURCE_URL: ${{ secrets.PODCAST_SCHEDULED_SOURCE_URL }}
        run: |
          EXTRA_FLAGS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_FLAGS="--mode ${{ github.event.inputs.mode }} --clips-target ${{ github.event.inputs.clips_target }}"
            if [ -n "${{ github.event.inputs.source_url }}" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --source '${{ github.event.inputs.source_url }}'"
            else
              echo "Notice: No source URL provided in manual dispatch. Enabling deliberate fallback-to-topic mode."
              EXTRA_FLAGS="$EXTRA_FLAGS --fallback-to-topic"
            fi
          else
            # Scheduled execution (cron)
            if [ -n "$PODCAST_SCHEDULED_SOURCE_URL" ]; then
              echo "Running scheduled podcast clipping from configured source."
              EXTRA_FLAGS="--source '$PODCAST_SCHEDULED_SOURCE_URL' --mode upload_private --clips-target 1"
            else
              echo "Notice: Scheduled run has no PODCAST_SCHEDULED_SOURCE_URL secret configured."
              echo "Executing deliberate original topic Short workflow instead of fake skip."
              EXTRA_FLAGS="--fallback-to-topic --mode upload_private --clips-target 1"
            fi
          fi

          echo "Running cloud automation with flags: $EXTRA_FLAGS"
          python -m benxautomation.cloud_runner $EXTRA_FLAGS

      - name: Verify Generated Video Outputs
        run: |
          python -c "
          from pathlib import Path
          out = Path('output')
          mp4s = [f for f in out.rglob('*.mp4') if f.is_file() and f.stat().st_size > 0]
          if not mp4s:
              raise SystemExit('ERROR: No valid non-empty MP4 video was generated in output directory.')
          print(f'Verification passed: Discovered {len(mp4s)} valid rendered video(s):')
          for m in mp4s:
              print(f'  ✓ {m} ({m.stat().st_size} bytes)')
          "

      - name: Upload Generated Video Assets & Metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podcast-shorts-output-${{ github.run_number }}
          path: |
            output/podcast_shorts/
            output/*_metadata.json
            output/*.srt
            output/*.vtt
            output/*.jpg
          retention-days: 14

      - name: Post-Run Failure Notification
        if: failure()
        run: |
          echo "::error::Podcast-to-Shorts pipeline failed. Check step logs for details."
