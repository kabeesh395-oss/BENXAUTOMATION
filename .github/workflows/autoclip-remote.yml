name: AutoClip Remote Publisher

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public video/VOD URL that you own or are licensed to repurpose
        required: true
        type: string
      language:
        description: Whisper language code (leave blank for auto-detect)
        required: false
        default: ""
        type: string
      whisper_model:
        description: Faster-Whisper model size
        required: true
        default: small
        type: choice
        options:
          - tiny
          - base
          - small
          - medium
      clip_count:
        description: Maximum number of public Shorts
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: autoclip-remote-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autoclip-app/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install AutoClip dependencies
        working-directory: autoclip-app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run remote AutoClip and publish Shorts
        working-directory: autoclip-app
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.AUTCLIP_YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.AUTCLIP_YOUTUBE_TOKEN_JSON }}
          OLLAMA_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:3b
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_LANGUAGE: ${{ inputs.language }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          CLIP_COUNT: ${{ inputs.clip_count }}
        run: |
          python remote_worker.py \
            --url "$VIDEO_URL" \
            --language "$VIDEO_LANGUAGE" \
            --model "$WHISPER_MODEL" \
            --count "$CLIP_COUNT"

      - name: Upload run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-run-${{ github.run_id }}
          path: autoclip-app/data/remote_outputs/
          if-no-files-found: ignore
          retention-days: 7
