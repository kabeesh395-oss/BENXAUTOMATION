name: Long-Form Landscape Weekly Automation

'on':
  # 2 Long-form videos Weekly: Sunday & Wednesday 06:30 PM IST (13:00 UTC)
  schedule:
    - cron: '0 13 * * 0,3'

  # Manual on-demand execution
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic for AI Script & Visual Generation'
        required: true
        default: '5 Surprising Mysteries of the Deep Sea'
      duration_seconds:
        description: 'Duration in seconds (e.g. 60 to 180)'
        required: true
        default: '60'
      format:
        description: 'Output Format (both = 16:9 + 9:16 Shorts, shorts = 9:16 Shorts, longform = 16:9)'
        required: true
        type: choice
        options:
          - 'both'
          - 'shorts'
          - 'longform'
        default: 'both'
      mode:
        description: 'Execution Mode'
        required: true
        type: choice
        options:
          - 'dry_run'          # Safe test without publishing
          - 'render_only'      # Render video and save artifacts
          - 'upload_private'   # Render and upload strictly as PRIVATE
        default: 'dry_run'

concurrency:
  group: longform-video-pipeline
  cancel-in-progress: false

jobs:
  longform-video:
    name: Generate Long-Form & Shorts Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore Persistent State (Upload Ledger)
        uses: actions/cache@v4
        id: ledger-cache
        with:
          path: output/upload_ledger.sqlite
          key: longform-state-${{ github.run_id }}
          restore-keys: |
            longform-state-

      - name: Hydrate OAuth Secrets
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
        run: |
          python -c "from benxautomation.cloud_runner import hydrate_oauth_secrets; ready, msgs = hydrate_oauth_secrets(); print(ready, msgs)"

      - name: Run Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_DURATION: ${{ github.event.inputs.duration_seconds }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          TOPIC="${INPUT_TOPIC:-5 Surprising Mysteries of the Deep Sea}"
          DUR="${INPUT_DURATION:-60}"
          FORMAT="${INPUT_FORMAT:-both}"

          # Intentional scheduled defaults vs manual dispatch
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="upload_private"
          else
            MODE="${INPUT_MODE:-dry_run}"
          fi

          # Input validation
          case "$FORMAT" in
            both|shorts|longform) ;;
            *) echo "ERROR: Invalid format '$FORMAT'. Must be both, shorts, or longform." && exit 1 ;;
          esac

          case "$MODE" in
            dry_run|render_only|upload_private) ;;
            *) echo "ERROR: Invalid mode '$MODE'. Must be dry_run, render_only, or upload_private." && exit 1 ;;
          esac

          if ! [[ "$DUR" =~ ^[0-9]+$ ]] || [ "$DUR" -le 0 ]; then
            echo "ERROR: Duration must be a positive integer in seconds (got: $DUR)." && exit 1
          fi

          # Resolve provider safely
          PROVIDER="auto"
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "Notice: Neither GEMINI_API_KEY nor OPENAI_API_KEY configured in secrets. Using offline fallback provider."
            PROVIDER="fallback"
          fi

          echo "Generating video: Topic='$TOPIC', Duration=$DUR, Format=$FORMAT, Mode=$MODE, Provider=$PROVIDER"
          python -m benxautomation.main --topic "$TOPIC" --duration "$DUR" --format "$FORMAT" --mode "$MODE" --provider "$PROVIDER"

      - name: Verify Generated Video Outputs and Decodability
        run: |
          python -c "
          from pathlib import Path
          import subprocess
          out = Path('output')
          mp4s = [f for f in out.rglob('*.mp4') if f.is_file() and f.stat().st_size > 0]
          if not mp4s:
              raise SystemExit('ERROR: No valid non-empty MP4 video was generated in output directory.')
          print(f'Verification passed: Discovered {len(mp4s)} valid rendered video(s):')
          for m in mp4s:
              print(f'  ✓ {m} ({m.stat().st_size} bytes)')
              res = subprocess.run(['ffmpeg', '-v', 'error', '-i', str(m), '-f', 'null', '-'], capture_output=True, text=True)
              if res.returncode != 0:
                  raise SystemExit(f'ERROR: File {m} failed FFmpeg decode: {res.stderr}')
              print('    -> FFmpeg decode: OK')
          "

      - name: Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-output-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/*.mp3
            output/**/*.srt
            output/**/*.json
            output/*.mp4
            output/*.mp3
            output/*.srt
            output/*.json
          retention-days: 14

      - name: Post-Run Failure Notification
        if: failure()
        run: |
          echo "::error::Long-Form pipeline failed. Check step logs for details."
