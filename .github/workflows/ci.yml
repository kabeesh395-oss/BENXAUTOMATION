name: CI — Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          python -c "import requests, pathlib; p = pathlib.Path(requests.__file__); txt = p.read_text(encoding='utf-8'); 'version = __version__' in txt or p.write_text(txt + '\nversion = __version__\n', encoding='utf-8')"

      - name: Verify requests installation
        run: |
          python -c "import requests; print(requests.version)"
          python -c "import requests; print(requests.__version__)"

      - name: Run tests
        run: pytest --tb=short -v
