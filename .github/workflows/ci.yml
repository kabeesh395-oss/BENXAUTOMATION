name: CI — Tests

'on':
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          # Retry transient Ubuntu package-mirror/network errors on hosted runners.
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify dependencies
        run: |
          python -c "import requests; print('requests.__version__:', requests.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run tests
        run: pytest --tb=short -v

  autoclip-app-tests:
    name: AutoClip standalone app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: autoclip-app/requirements-dev.txt

      - name: Install AutoClip app dependencies
        working-directory: autoclip-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run AutoClip app tests
        working-directory: autoclip-app
        run: python -m pytest -q tests
